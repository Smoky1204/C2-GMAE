device: 0

# # Dataset settings
feat_dim: 2325

# # Training settings
epochs: 1000
optim: adam
init_lr: 0.001
weight_decay: 0
use_schedule: true
step_size: 50
gamma: 0.5

lr_eval: 0.01
wd_eval: 0.0
epochs_eval: 2000

# # Pretraining settings
mask_ratio: 0.25
replace_ratio: 0.0

masked_atom_loss: 1.0
#0.01
masked_pe_loss: 0.01
atom_recon_type: sce
alpha_l: 2.0
noise_val: 0.01

# # Encoder & Decoder setting
enc_gnn_layer: 3
embed_dim: 1024
heads: 4
gnn_dropout: 0.6
gnn_edge_dropout: 0
gnn_activation: elu
task_head_activation: gelu

# # Positional Encoding (PE) settings
max_freqs: 50
pos_activation: gelu
partition_num: 40


beta_hetero_scale: 0.1
gamma_hetero_gate: 0.7
kappa_noise_scale: 0.1
lambda_H: 0.1

disc_loss_weight: 0.01
hetero_strategy: "percentile"  
hetero_top_p: 0.2               
hetero_tau: 0.2              